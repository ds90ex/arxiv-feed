name: Fetch daily arXiv listings

on:
  schedule:
    - cron: "30 5 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser
      - run: python fetch_arxiv.py
      - name: Commit
        run: |
          git config user.name "arxiv-bot"
          git config user.email "arxiv-bot@users.noreply.github.com"
          git add data/
          git commit -m "arXiv listings $(date -u +%F)" || echo "nothing to commit"
          git push
